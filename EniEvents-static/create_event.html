<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء فعالية - نظام إدارة الفعاليات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="assets/logo.png" alt="Logo">
                <h1>نظام إدارة الفعاليات</h1>
            </div>
            <button id="menuToggle" class="menu-toggle" aria-label="قائمة" type="button">
                <i class="fas fa-bars"></i>
            </button>
            <nav id="mainNav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-info-circle"></i> نبذة عن المشروع</a></li>
                    <li><a href="home.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                    <li><a href="events.html"><i class="fas fa-calendar-alt"></i> الفعاليات</a></li>
                    <li><a href="create_event.html"><i class="fas fa-plus-circle"></i> إنشاء فعالية</a></li>
                    <li><button id="themeToggle" class="theme-toggle" style="background: none; border: 2px solid var(--primary-color); color: var(--primary-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: all 0.3s;"><i class="fas fa-moon"></i> وضع داكن</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary-color);">
                <i class="fas fa-plus-circle"></i> إنشاء فعالية جديدة
            </h2>
            
            <form>
                <div class="form-group">
                    <label for="name"><i class="fas fa-heading"></i> اسم الفعالية:</label>
                    <input type="text" id="name" name="name">
                </div>
                
                <div class="form-group">
                    <label for="description"><i class="fas fa-align-right"></i> الوصف:</label>
                    <textarea id="description" name="description" rows="5"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="event_date"><i class="fas fa-calendar"></i> التاريخ والوقت:</label>
                    <input type="datetime-local" id="event_date" name="event_date">
                </div>
                
                <div class="form-group">
                    <label for="location"><i class="fas fa-map-marker-alt"></i> الموقع:</label>
                    <input type="text" id="location" name="location">
                </div>
                
                <div class="form-group">
                    <label for="total_seats"><i class="fas fa-chair"></i> عدد المقاعد:</label>
                    <input type="number" id="total_seats" name="total_seats" min="1">
                </div>
                
                <div class="form-group">
                    <label for="event_type"><i class="fas fa-tag"></i> نوع الفعالية:</label>
                    <select id="event_type" name="event_type">
                        <option value="">اختر النوع</option>
                        <option value="workshop">ورشة عمل</option>
                        <option value="lecture">محاضرة</option>
                        <option value="conference">مؤتمر</option>
                        <option value="seminar">ندوة</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <button type="button" class="btn btn-primary btn-block">
                    <i class="fas fa-plus"></i> إنشاء الفعالية
                </button>
                
                <a href="home.html" class="btn btn-secondary btn-block" style="margin-top: 10px; text-align: center;">
                    <i class="fas fa-times"></i> إلغاء
                </a>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 نظام إدارة الفعاليات الجامعية</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/mobile-menu.js"></script>
</body>
</html>
